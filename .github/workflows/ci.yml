name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prototype/requirements.txt

      - name: Run the full test suite
        working-directory: prototype
        env:
          # Test-only credentials; the suite never uses real secrets.
          DSH_ADMIN_PASSWORD: ci-test-password
        run: python -m pytest tests/ -q --tb=short

      - name: Verify the tick-engine golden file still reproduces
        working-directory: prototype
        run: python -m pytest tests/test_golden.py -q

  # Version-support matrix (U0). The dev workstation runs 3.14; the
  # Windows MT5 bridge VPS must run 3.13 or older — MetaTrader5
  # (5.0.6231, PyPI-verified 2026-11-24) ships wheels only for
  # cp38..cp313, no cp314 yet. CI proves the suite on both.
  test-313:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prototype/requirements.txt
      - name: Run the full test suite
        working-directory: prototype
        env:
          DSH_ADMIN_PASSWORD: ci-test-password
        run: python -m pytest tests/ -q --tb=short

  # The real XAUUSD dataset (207M+ ticks) is too large for CI runners.
  # Tests that need it carry the `requires_dataset` marker and are
  # SKIPPED (never silently passed) when the store is absent; the
  # golden backtest and full-dataset validation run on the workstation
  # per docs/phase1c_validation.md.
